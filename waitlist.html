	</head>
	<body class="no-sidebar is-preload">
		<div id="page-wrapper">

			<!-- Header -->
				<div id="header-wrapper">
					<div id="header" class="container">

						<!-- Logo -->
							<h1 id="logo"><a href="index.html">AI Athletics</a></h1>

						<!-- Nav -->
							<nav id="nav">
								<ul>
									<li><a href="app.html">App</a></li>
									<li><a href="mvp.html">MVP</a></li>
									<li class="break"><a href="waitlist.html">Waitlist</a></li>
									<li><a href="contact.html">Contact</a></li>
								</ul>
							</nav>

					</div>
				</div>
				
				<!-- Main -->
				<div class="wrapper">
					<div class="container" id="main">

						<section class="waitlist-section">

							<header class="major">
								<h2>Join the Waitlist</h2>
								<p>
									Get early access to AI Athletics and receive 50% off when the app launches.
								</p>
							</header>

							<div class="waitlist-form-wrapper">

								<form id="waitlist-form">

									<div class="row gtr-50">

										<div class="col-12">
											<input
												type="text"
												id="name"
												name="name"
												placeholder="Your name"
												required
											/>
										</div>

										<div class="col-12">
											<input
												type="email"
												id="email"
												name="email"
												placeholder="Your email"
												required
											/>
										</div>

										<div class="col-12">
											<select id="role" name="role" required>
												<option value="">I am a...</option>
												<option value="Athlete">Athlete</option>
												<option value="Coach">Coach</option>
												<option value="Other">Other</option>
											</select>
										</div>

										<div class="col-12">
											<input
												type="text"
												id="sport"
												name="sport"
												placeholder="Sport"
											/>
										</div>

										<div class="col-12">
											<input
												type="text"
												id="club"
												name="club"
												placeholder="Club / Team"
											/>
										</div>

										<div class="col-12">
											<ul class="actions special">
												<li>
													<input
														type="submit"
														value="Join the Waitlist"
													/>
												</li>
											</ul>
										</div>

									</div>

								</form>

							</div>

						</section>

					</div>
				</div>

			<!-- Footer -->
				<div id="footer-wrapper">

					<footer id="footer" class="container">

						<div class="footer-brand">

							<h2>AI Athletics</h2>

							<p>
								AI-powered sprint analysis for athletes and coaches.
							</p>

						</div>

							<a href="contact.html">Contact</a>

						</div>

							</p>

						</div>

					</footer>
